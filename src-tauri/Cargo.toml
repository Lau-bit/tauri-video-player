[package]
name = "video-player-tauri"
version = "1.0.0"
description = "Minimalist video player, ported to Tauri"
authors = ["slaur"]
edition = "2021"

[lib]
name = "video_player_tauri_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
